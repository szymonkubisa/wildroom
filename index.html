<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildroom</title>
    <!-- The Wildroom mark (AppLogo.vue's strands) on a dark tile, so it reads on light and dark tab bars. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pick the saved theme before the first paint (src/client/lib/theme.ts keeps it up to date).
      try {
        var theme = localStorage.getItem('studio.theme')
        if (theme === 'light' || (theme === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
